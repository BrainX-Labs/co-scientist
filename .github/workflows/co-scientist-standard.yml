name: Headless Co-Scientist Research (Standard)

on:
  workflow_dispatch:
    inputs:
      research_topic:
        description: 'Scientific topic or question to research'
        required: true
        default: 'Prime gap distribution and verification of algebraic lemmas'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Research Branch
        run: git switch --create "research/${GITHUB_RUN_ID}"

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y curl build-essential
          curl -fsSL https://pi.dev/install.sh | sh
          PI_BIN_DIR="$(dirname "$(command -v pi)")"
          echo "$PI_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$PI_BIN_DIR:$PATH"
          mkdir -p "$HOME/.pi/agent"
          cp .pi/agent/models.json "$HOME/.pi/agent/models.json"
          pi install npm:pi-mcp-extension --approve
          pi install npm:pi-web-access --approve
          pip install 'litellm[proxy]' lean-mcp
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          export PATH="$HOME/.elan/bin:$PATH"
          lake new lean4_workspace math || true

      - name: Run Research Task
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          litellm --model nvidia_nim/moonshotai/kimi-k3 --port 8080 --drop_params > "$RUNNER_TEMP/litellm.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/litellm.log"
              exit 1
            fi
            sleep 2
          done
          set -o pipefail
          pi --provider nvidia-litellm-proxy --model nvidia_nim/moonshotai/kimi-k3 --mode json "Investigate: '${{ github.event.inputs.research_topic }}'. Output research_report.md." \
            | tee "$RUNNER_TEMP/pi-events.jsonl"

      - name: Upload Pi JSON events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-events-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pi-events.jsonl
            ${{ runner.temp }}/litellm.log
          if-no-files-found: ignore

      - name: Commit Report
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH_NAME="research/${GITHUB_RUN_ID}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "research: automated report update [skip ci]"
            git push --set-upstream origin "$BRANCH_NAME"
          fi
